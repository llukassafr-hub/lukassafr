name: Deliver story5 English smaller captions
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story5-english-small.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story5-english-small/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story5-english-small/part* > videos/pribeh5-english-smaller-captions.mp4
          echo '04677f2eb99fdb5a817a14beba7ce46f4b1f8a4edcc6de6339e17f66e2389b11  videos/pribeh5-english-smaller-captions.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh5-english-smaller-captions.mp4
          git commit -m "Deliver story5 English dialogue captions in smaller motion style"
          git push
