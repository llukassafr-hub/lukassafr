name: Deliver story with replacement shots
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story-replace.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story-replace/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/story-replace/part* > videos/pribeh-nove-zabery.mp4
          echo '90c0aed757af35fdb2936c85deffe52c2360de1489168b918083fcea09c11f26  videos/pribeh-nove-zabery.mp4' | sha256sum -c -
      - name: Save revised video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh-nove-zabery.mp4
          git commit -m "Replace opening and BMW shot while retaining friend turn"
          git push
