name: Deliver story7 new music and outro
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story7-new-music-outro.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story7-new-music-outro/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story7-new-music-outro/part* > videos/pribeh7-jina-hudba-novy-zaver.mp4
          echo '9d11f6977e7587c0c64e0133a8411bd77a5457a8a493d3738a7cfffeb2620a23  videos/pribeh7-jina-hudba-novy-zaver.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh7-jina-hudba-novy-zaver.mp4
          git commit -m "Deliver story7 alternate music and refreshed real footage outro"
          git push
