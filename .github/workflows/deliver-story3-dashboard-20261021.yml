name: Deliver rewards dashboard replacement
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-dashboard-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-dashboard-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story3-dashboard-20261021/part* > videos/pribeh3-dashboard-odmen.mp4
          echo '568c4582c5b4391122b82b47f680f0921ff3ba4104efc5b52afc8ba27c7b6847  videos/pribeh3-dashboard-odmen.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-dashboard-odmen.mp4
          git commit -m "Deliver rewards dashboard replacement"
          git push
