name: Deliver animated story with full ad
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-klipni-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-klipni-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/story3-klipni-20261021/part* > videos/pribeh3-klipni.mp4
          echo '2f1854ca3ced5c39b28f13421c5cadde2a6580b8dec0855c04786e66d464e525  videos/pribeh3-klipni.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-klipni.mp4
          git commit -m "Deliver animated story with full Klipni ad"
          git push
