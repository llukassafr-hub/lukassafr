name: Deliver Story 4 BMW outro
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story4-bmw-outro-20261022.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story4-bmw-outro-20261022/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story4-bmw-outro-20261022/part* > videos/pribeh4-zaver-bmw.mp4
          echo '32dbbb49eb59c41e1c0bf2ee128425fdc3c206d90bdf745de16209a2d9a33c08  videos/pribeh4-zaver-bmw.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh4-zaver-bmw.mp4
          git commit -m "Deliver shortened first shot and BMW replacements"
          git push
