name: Deliver key after money
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-pov-key-order-20261020.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/pov-key-order-20261020/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/pov-key-order-20261020/part* > videos/pov-klic-po-penezich.mp4
          echo 'bbbe719e70010291247afa9e208623da3ec06dc5137bde3a46585c6cf6087e83  videos/pov-klic-po-penezich.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pov-klic-po-penezich.mp4
          git commit -m "Deliver key shot immediately after money"
          git push
