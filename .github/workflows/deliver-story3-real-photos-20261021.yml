name: Deliver story with real photos
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-real-photos-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-real-photos-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/story3-real-photos-20261021/part* > videos/pribeh3-realne-fotky.mp4
          echo '42282ceac8730ec13de065e5230ef596c3344ceebe14d133e8f52f4218f9f177  videos/pribeh3-realne-fotky.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-realne-fotky.mp4
          git commit -m "Deliver short animated photo overlays for transformation, Instagram, and work"
          git push
