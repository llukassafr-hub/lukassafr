name: Deliver Klipni screen replacement
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-klipniscreen-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-klipniscreen-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story3-klipniscreen-20261021/part* > videos/pribeh3-klipni-screen.mp4
          echo '55d0ce54871e85de41bd52ddf80205fdf517e7238dc8e299365d258e6e2c2fbd  videos/pribeh3-klipni-screen.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-klipni-screen.mp4
          git commit -m "Deliver final Klipni screenshot replacement"
          git push
