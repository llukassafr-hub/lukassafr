name: Deliver Story 4 photos and real outro
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story4-photos-outro-20261022.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story4-photos-outro-20261022/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story4-photos-outro-20261022/part* > videos/pribeh4-fotky-realny-zaver.mp4
          echo 'c1836925e82bb69f4b34223c9dd72cecaddaae7cfce63486886c18139b6a10eb  videos/pribeh4-fotky-realny-zaver.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh4-fotky-realny-zaver.mp4
          git commit -m "Deliver Story 4 with photos and real outro"
          git push
