name: Deliver shorter story without captions
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-clean-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-clean-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/story3-clean-20261021/part* > videos/pribeh3-bez-textu-sviznejsi.mp4
          echo '3bb9698c48fda9caca362a8402288918fd6ed3003d3ae892f9ef4c5103e17107  videos/pribeh3-bez-textu-sviznejsi.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-bez-textu-sviznejsi.mp4
          git commit -m "Deliver shorter story with clean dialogue and office ending"
          git push
