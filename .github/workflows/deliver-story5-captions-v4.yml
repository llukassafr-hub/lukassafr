name: Deliver Story 5 captions reference
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story5-captions-v4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story5-captions-v4/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story5-captions-v4/part* > videos/pribeh5-titulky-reference.mp4
          echo 'dff65bf6c03f7a383ed9d8618d158fa0f63fafbb04ca0ce45b2d0ffc3714aa92  videos/pribeh5-titulky-reference.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh5-titulky-reference.mp4
          git commit -m "Deliver Story 5 captions and cut fixes"
          git push
