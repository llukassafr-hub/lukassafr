name: Deliver seventh Klipni story
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story7-klipni-20261026.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story7-klipni-20261026/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story7-klipni-20261026/part* > videos/pribeh7-klipni.mp4
          echo '4b2eef1e17109e483d15129b331ff150e694b46ab620359fc16304951958362f  videos/pribeh7-klipni.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh7-klipni.mp4
          git commit -m "Deliver seventh Klipni story with motion captions and real-life outro"
          git push
