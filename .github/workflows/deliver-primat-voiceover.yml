name: Deliver Primat video with voiceover
on:
  push:
    paths:
      - '.github/workflows/deliver-primat-voiceover.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download finished video
        run: |
          mkdir -p videos
          curl --fail --location --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3EgTDnqHrsNYio6FRgE7zFqDsKY/73591a93-6082-4c03-952e-369b1acea8f7.mp4' --output videos/primat-s-voiceoverem.mp4
          test "$(wc -c < videos/primat-s-voiceoverem.mp4)" -eq 11076494
      - name: Upload downloadable video
        uses: actions/upload-artifact@v4
        with:
          name: primat-s-voiceoverem
          path: videos/primat-s-voiceoverem.mp4
      - name: Save video in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos/primat-s-voiceoverem.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Add finished Primat video with voiceover"
          git push
