name: Deliver corrected ending order
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-ending-order-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-ending-order-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/story3-ending-order-20261021/part* > videos/pribeh3-spravne-poradi-konce.mp4
          echo '948d44037dcbc2ee917468854a7d225165e9e23487c76dce8ebd671d129c110c  videos/pribeh3-spravne-poradi-konce.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-spravne-poradi-konce.mp4
          git commit -m "Deliver arrival, response, then departure ending"
          git push
