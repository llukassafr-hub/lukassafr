name: Deliver reels motion captions
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-reels-recyklace.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/reels-recyklace/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/reels-recyklace/part* > videos/moje-reels-motion-titulky.mp4
          echo '2e226032c446747878885ba3ab4dd2b8d17e98e950cd7a1e7ce8079df15e1307  videos/moje-reels-motion-titulky.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/moje-reels-motion-titulky.mp4
          git commit -m "Deliver reels with animated captions and brief table"
          git push
