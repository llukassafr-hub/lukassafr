name: Deliver Story 5 real outro with beat flashes
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story5-outro-flash-v7.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story5-outro-flash-v7/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story5-outro-flash-v7/part* > videos/pribeh5-realny-zaver-flash.mp4
          echo '5ba4d1db6f0bcda1c370cda4bfb949f2c3f3f126824855d9f7de98db916b5414  videos/pribeh5-realny-zaver-flash.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh5-realny-zaver-flash.mp4
          git commit -m "Deliver Story 5 with 13 real outro shots and beat flashes"
          git push
