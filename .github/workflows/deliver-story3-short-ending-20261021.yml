name: Deliver shorter ending
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-short-ending-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-short-ending-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/story3-short-ending-20261021/part* > videos/pribeh3-kratsi-zaver.mp4
          echo '062c5acb29b481d0e9fb7777fa182424ff7563ac49626e22896fc97a66d1ff00  videos/pribeh3-kratsi-zaver.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-kratsi-zaver.mp4
          git commit -m "Deliver shorter arrival and ending immediately after dialogue"
          git push
