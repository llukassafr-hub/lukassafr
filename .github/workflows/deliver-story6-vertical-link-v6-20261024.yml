name: Deliver sixth story vertical link placeholder
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story6-vertical-link-v6-20261024.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story6-vertical-link-v6-20261024/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story6-vertical-link-v6-20261024/part* > videos/pribeh6-odkaz-9x16.mp4
          echo '55c93bed1bd7842d57aa26499a52171d03e6bd6a15858ad59734719835384f34  videos/pribeh6-odkaz-9x16.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh6-odkaz-9x16.mp4
          git commit -m "Deliver vertical 9:16 real story link placeholder"
          git push
