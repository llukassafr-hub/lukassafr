name: Deliver Story 5 without visible earrings
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story5-no-earrings-20261023.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story5-no-earrings-20261023/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story5-no-earrings-20261023/part* > videos/pribeh5-bez-nausnic.mp4
          echo 'e7a908f4e7b66819c779432bf9cd13b2c329679ed1086aef547c0cac06f22c16  videos/pribeh5-bez-nausnic.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh5-bez-nausnic.mp4
          git commit -m "Deliver tracked earring retouch for Story 5"
          git push
