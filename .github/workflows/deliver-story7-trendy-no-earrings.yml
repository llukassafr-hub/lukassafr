name: Deliver story7 trendy without earrings
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story7-trendy-no-earrings.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story7-trendy-no-earrings/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story7-trendy-no-earrings/part* > videos/pribeh7-trendy-bez-nausnic.mp4
          echo '9a3202edfb5ed0e3db26a0ae7d27df15aefdda2ec47322f0db1a131c763059cf  videos/pribeh7-trendy-bez-nausnic.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh7-trendy-bez-nausnic.mp4
          git commit -m "Deliver story7 with trendy music, Klipni office and removed earrings"
          git push
