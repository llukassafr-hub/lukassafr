name: Deliver Story 4 replacement first outro shot
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story4-first-outro-20261022.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story4-first-outro-20261022/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story4-first-outro-20261022/part* > videos/pribeh4-novy-prvni-zaver.mp4
          echo 'd2500c159a735f0d6675d32815d93ff5eaa653925b9aadb4800e25fc6ca7ccb8  videos/pribeh4-novy-prvni-zaver.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh4-novy-prvni-zaver.mp4
          git commit -m "Deliver replacement first outro shot"
          git push
