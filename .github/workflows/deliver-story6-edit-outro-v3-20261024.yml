name: Deliver sixth story editing outro
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story6-edit-outro-v3-20261024.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story6-edit-outro-v3-20261024/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story6-edit-outro-v3-20261024/part* > videos/pribeh6-realny-zaver-edit.mp4
          echo '516e59f96f1937f4d45712972f3eb503df65aee47df30cb4c48a0125a4705aa4  videos/pribeh6-realny-zaver-edit.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh6-realny-zaver-edit.mp4
          git commit -m "Deliver sixth story with real editing footage from story three"
          git push
