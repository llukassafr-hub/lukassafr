name: Deliver reel with BMW key
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-pov-key-added-20261020.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/pov-key-added-20261020/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/pov-key-added-20261020/part* > videos/pov-s-klicem.mp4
          echo '43063dcbaf1880d0f193db14b263f3a38530c144dca8dba9c4e1b40debd17822  videos/pov-s-klicem.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pov-s-klicem.mp4
          git commit -m "Deliver reel with BMW key shot"
          git push
