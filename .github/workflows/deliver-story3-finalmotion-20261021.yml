name: Deliver final motion story
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-finalmotion-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-finalmotion-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story3-finalmotion-20261021/part* > videos/pribeh3-final-motion.mp4
          echo '9a0ae97058db4601998d1d923b5699d95bf7657ab67560247adb85522c8cfbea  videos/pribeh3-final-motion.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-final-motion.mp4
          git commit -m "Deliver three word captions and improved continuation title"
          git push
