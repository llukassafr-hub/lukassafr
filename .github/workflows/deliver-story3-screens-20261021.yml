name: Deliver story screens
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-screens-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-screens-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/story3-screens-20261021/part* > videos/pribeh3-screeny.mp4
          echo 'bc0d8b09d981915ca698e8a2eed775c58441b8571eadd095689fb0eb06dcb796  videos/pribeh3-screeny.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-screeny.mp4
          git commit -m "Deliver story with social screenshots"
          git push
