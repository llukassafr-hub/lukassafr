name: Deliver motion captions
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-motioncaptions-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-motioncaptions-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story3-motioncaptions-20261021/part* > videos/pribeh3-motion-titulky.mp4
          echo '8dd4eb1ff569149589d3d13411cc263a0d607d1d106ecbe82fbb2b93a2424e27  videos/pribeh3-motion-titulky.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-motion-titulky.mp4
          git commit -m "Deliver higher animated captions"
          git push
