name: Deliver Story 4 added outro shot
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story4-added-outro-20261022.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story4-added-outro-20261022/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story4-added-outro-20261022/part* > videos/pribeh4-doplneny-zaver.mp4
          echo '4120b7c55150f5ace8e03f5417cebb5bb596cf78c2619cb201eefe14be067650  videos/pribeh4-doplneny-zaver.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh4-doplneny-zaver.mp4
          git commit -m "Deliver added outro shot"
          git push
