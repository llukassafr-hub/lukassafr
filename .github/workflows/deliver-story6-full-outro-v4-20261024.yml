name: Deliver expanded sixth story outro
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story6-full-outro-v4-20261024.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story6-full-outro-v4-20261024/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story6-full-outro-v4-20261024/part* > videos/pribeh6-plny-realny-zaver.mp4
          echo '102eb671376ecbb78bb36dea91472b9bd12804d5a308771149b067ed54f7e42a  videos/pribeh6-plny-realny-zaver.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh6-plny-realny-zaver.mp4
          git commit -m "Deliver expanded sixth story outro with editing watches BMW and Camaro"
          git push
