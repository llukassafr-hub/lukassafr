name: Deliver Story 4 shopping and July date
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story4-shopping-july-20261022.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story4-shopping-july-20261022/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story4-shopping-july-20261022/part* > videos/pribeh4-nakupy-cervenec2026.mp4
          echo '8c427d6c5840d7e0d2097750f73dcc83181724c0860aeca197ffc3eb0ce72b5f  videos/pribeh4-nakupy-cervenec2026.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh4-nakupy-cervenec2026.mp4
          git commit -m "Deliver combined shopping scene and July 2026 date"
          git push
