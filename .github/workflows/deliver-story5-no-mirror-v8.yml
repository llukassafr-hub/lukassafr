name: Deliver Story 5 without mirror shot
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story5-no-mirror-v8.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story5-no-mirror-v8/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story5-no-mirror-v8/part* > videos/pribeh5-bez-zrcadla.mp4
          echo 'bd92b12338189e5b0efac13f5f0b8dabc6f8d6b68ab17dbeaaa8f25f4c74f251  videos/pribeh5-bez-zrcadla.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh5-bez-zrcadla.mp4
          git commit -m "Deliver Story 5 without mirror shot"
          git push
