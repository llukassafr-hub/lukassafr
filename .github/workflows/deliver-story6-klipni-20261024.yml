name: Deliver story six
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story6-klipni-20261024.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story6-klipni-20261024/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story6-klipni-20261024/part* > videos/pribeh6-klipni.mp4
          echo 'da84b57f0649e0f14fa586f59aa7d059e893c552de496e05b837349b13d8d051  videos/pribeh6-klipni.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh6-klipni.mp4
          git commit -m "Deliver edited sixth Klipni story"
          git push
