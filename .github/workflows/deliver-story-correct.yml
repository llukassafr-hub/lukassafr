name: Deliver corrected BMW placement and clean opening
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story-correct.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story-correct/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/story-correct/part* > videos/pribeh-opravene-zabery.mp4
          echo 'ee0c8cc74c7a2adf5cc433bb1349d1cc9098e29cea17ce2f99af02f72ddee247  videos/pribeh-opravene-zabery.mp4' | sha256sum -c -
      - name: Save revised video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh-opravene-zabery.mp4
          git commit -m "Restore earlier BMW shot, replace post-recognition reaction and clean intro"
          git push
