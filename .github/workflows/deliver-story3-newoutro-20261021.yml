name: Deliver updated real outro
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-newoutro-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-newoutro-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story3-newoutro-20261021/part* > videos/pribeh3-novy-realny-zaver.mp4
          echo '0aed2669dd2b13625c28618327a410215e1cf2ca1b5faaede9057883c80a7f24  videos/pribeh3-novy-realny-zaver.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-novy-realny-zaver.mp4
          git commit -m "Deliver new real footage outro"
          git push
