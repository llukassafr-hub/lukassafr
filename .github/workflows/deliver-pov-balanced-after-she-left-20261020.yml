name: Deliver balanced POV with new intro text
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-pov-balanced-after-she-left-20261020.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/pov-balanced-after-she-left-20261020/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/pov-balanced-after-she-left-20261020/part* > videos/pov-after-she-left.mp4
          echo 'cc8c237f75ccb7ca289aab27c6458848db68a74474bdec387bea723349d146f5  videos/pov-after-she-left.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pov-after-she-left.mp4
          git commit -m "Deliver individually balanced shots with softer grade and new opening text"
          git push
