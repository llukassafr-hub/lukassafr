name: Deliver fifth story BMW and photo revision
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story5-bmw-photos-v9-20261026.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story5-bmw-photos-v9-20261026/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story5-bmw-photos-v9-20261026/part* > videos/pribeh5-bmw-nove-fotky.mp4
          echo 'af7ada68f2b9f8717faf84e670b3134d1b71523cf96f7a6799cdab591b248da9  videos/pribeh5-bmw-nove-fotky.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh5-bmw-nove-fotky.mp4
          git commit -m "Deliver fifth story with short BMW cuts single Camaro and updated photos"
          git push
