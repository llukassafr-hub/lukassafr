name: Deliver no-label video
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-pov-no-labels-20261020.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/pov-no-labels-20261020/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/pov-no-labels-20261020/part* > videos/pov-bez-textu.mp4
          echo '3696122162db3f606576a80633007e8406c842c5d9adeb9c8535207139907c77  videos/pov-bez-textu.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pov-bez-textu.mp4
          git commit -m "Deliver video without short motion labels"
          git push
