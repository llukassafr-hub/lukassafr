name: Deliver smooth video
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-smooth-holds-20261018.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/smooth-holds-20261018/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/smooth-holds-20261018/part* > videos/pribeh-plynuly-zaver.mp4
          echo 'fe366930cb647d6708b6a09c36ef3ffa70671bcf467191468bb9370ee467d195  videos/pribeh-plynuly-zaver.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh-plynuly-zaver.mp4
          git commit -m "Deliver video with smooth shot endings"
          git push
