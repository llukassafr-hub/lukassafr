name: Deliver POV with uploaded BMW footage
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-pov-bmw-replaced-20261020.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/pov-bmw-replaced-20261020/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/pov-bmw-replaced-20261020/part* > videos/pov-bmw-nahrazene-zabery.mp4
          echo '99ed3563f9818b9bf22559945370f04386be0eb3d2bead1f5165e4ca5a7bbf88  videos/pov-bmw-nahrazene-zabery.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pov-bmw-nahrazene-zabery.mp4
          git commit -m "Deliver POV with replaced rear side and interior BMW shots"
          git push
