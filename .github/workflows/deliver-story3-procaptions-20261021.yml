name: Deliver improved captions
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-procaptions-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-procaptions-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble video
        run: |
          mkdir -p videos
          cat .delivery/story3-procaptions-20261021/part* > videos/pribeh3-titulky-pro.mp4
          echo 'ff648bfb1374979be16331cb7166bd83202d569641d57455d30a5c5ed863e20c  videos/pribeh3-titulky-pro.mp4' | sha256sum -c -
      - name: Save video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-titulky-pro.mp4
          git commit -m "Deliver refined animated captions"
          git push
