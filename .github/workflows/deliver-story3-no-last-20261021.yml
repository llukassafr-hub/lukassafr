name: Deliver story without last shot
on:
  push:
    branches: [reel-export-delivery]
    paths: ['.github/workflows/deliver-story3-no-last-20261021.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.delivery/story3-no-last-20261021/
          sparse-checkout-cone-mode: false
      - name: Assemble verified video
        run: |
          mkdir -p videos
          cat .delivery/story3-no-last-20261021/part* > videos/pribeh3-bez-posledniho-zaberu.mp4
          echo '6d70fbc251b816642330867555cab6fe84dbbb8b1c3fa865c88112786323977d  videos/pribeh3-bez-posledniho-zaberu.mp4' | sha256sum -c -
      - name: Save finished video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse videos/pribeh3-bez-posledniho-zaberu.mp4
          git commit -m "Deliver story without final office shot"
          git push
